apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.application.name }}-secret-loader"
  namespace: "{{ .Values.application.namespace }}" 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "{{ .Values.application.name }}-secret-loader"
  template:
    metadata:
      labels:
        app: "{{ .Values.application.name }}-secret-loader"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: app
                operator: In
                values:
                - cloudblogs
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: "{{ .Values.application.name }}-secret-loader"
              topologyKey: "kubernetes.io/hostname"
      serviceAccountName: "{{ .Values.application.name }}-sa"
      securityContext:
        runAsUser: 11000 #nodeuser
        runAsGroup: 22000 #nodeuser
      containers:
      - name: "{{ .Values.application.name }}-secret-loader"
        image: "{{ .Values.application.secrets.secretLoaderImage }}" 
        volumeMounts:
          # Backup storage key mount from KV
          - name: "{{ .Values.application.storages.backupStore.secretProviderClass }}-inline"
            mountPath: "/mnt/secrets/{{ .Values.application.namespace }}/backupstorekeys"
            readOnly: true
          # Log storage key mount from KV
          - name: "{{ .Values.application.storages.logStore.secretProviderClass }}-inline"
            mountPath: "/mnt/secrets/{{ .Values.application.namespace }}/logstorekeys"
            readOnly: true
          # Media storage key mount from KV
          - name: "{{ .Values.application.storages.mediaStore.secretProviderClass }}-inline"
            mountPath: "/mnt/secrets/{{ .Values.application.namespace }}/mediastorekeys"
            readOnly: true
          # Wordpress configuration mount from KV
          - name: "{{ .Values.application.secrets.secretProviderClass }}-inline"
            mountPath: "/mnt/secrets/{{ .Values.application.namespace }}/appconfigkeys"
            readOnly: true
          # TLS certificate mount from KV
          - name: "{{ .Values.application.namespace }}-tls-inline"
            #subPath: wildcart-cloud-blogs-certificate
            mountPath: "/mnt/secrets/{{ .Values.application.namespace }}/tlscertificate"
            readOnly: true
        resources:
          limits:
            cpu: 200m
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
      volumes:
        - name: "{{ .Values.application.storages.backupStore.secretProviderClass }}-inline"
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.application.storages.backupStore.secretProviderClass }}"
        - name: "{{ .Values.application.storages.logStore.secretProviderClass }}-inline"
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.application.storages.logStore.secretProviderClass }}"
        - name: "{{ .Values.application.storages.mediaStore.secretProviderClass }}-inline"
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.application.storages.mediaStore.secretProviderClass }}"
        - name: "{{ .Values.application.secrets.secretProviderClass }}-inline"
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.application.secrets.secretProviderClass }}"
        - name: "{{ .Values.application.namespace }}-tls-inline"
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "{{ .Values.application.name }}-tls-secret"
