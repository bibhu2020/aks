# Default values for secblog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

application: 
  namespace: "secblog"
  name: "secblog"
  hostHeader: "secblog.cloudblogsaksstg.microsoft.com" #"securityblog-d6gfc2gghkavefda.z01.azurefd.net"
  image:
    repository: "aksocstgacr.azurecr.io/securityblog-stage"
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "41864"
  secrets:
    secretLoaderImage: "aksocstgacr.azurecr.io/onecloud-health-probe:v1"
    secretRefName: "aksoc-stg-secblog-kv"
    secretProviderClass: "aksoc-stg-secblog-kv"
  storages:
    mediaStore:
      persistentVolumeClaim: "aksocstgeastusmedia-secblog"
      secretProviderClass: "aksocstgeastusmedia-aksoc-stg-eastus-kv1"
    logStore:
      persistentVolumeClaim: "aksocstgeastuslogs-secblog"
      secretProviderClass: "aksocstgeastuslogs-aksoc-stg-eastus-kv1"
    backupStore:
      persistentVolumeClaim: "aksocstgeastusbackups-secblog"
      secretProviderClass: "aksocstgeastusbackups-aksoc-stg-eastus-kv1"
  databases:
    mysql:
      inClusterDb: "true"
      host: "mysql-0.mysql-headless-svc.secblog.svc.cluster.local" 
      image: "aksocstgacr.azurecr.io/mysql:8.0"
      xtrabackupImage: "aksocstgacr.azurecr.io/xtrabackup:1.0"
  resources:
    primaryResourceGroup: "aksoc-stg-eastus-secblog-rg"
    primaryLocation: "eastus"
  cronJobs:
    dbBackup:
      enabled: "true"
      image: "aksocstgacr.azurecr.io/onecloud-mysql-client:v1"
      dbServer: "mysql-0.mysql-headless-svc.secblog.svc.cluster.local"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

nodeSelector: {}

tolerations: []

affinity: {}
